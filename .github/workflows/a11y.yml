name: Accessibility (axe-core)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --host 127.0.0.1 --port 4173 &
          # Wait for the server to be ready (up to 30s).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview up"; break
            fi
            sleep 1
          done

      - name: Run axe accessibility tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173
        run: bunx playwright test tests/a11y.spec.ts --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
